version: '3.8'

services:
  # ===== Infra =====
  mysql:
    image: mysql:8.4
    container_name: codelab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    networks: [codelab]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    ports:
      - "3308:3306"

  kafka:
    image: apache/kafka:3.9.0
    container_name: codelab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [codelab]
    ports:
      - "9092:9092"

  # ===== Servicos =====
  auth-service:
    build: ./backend/auth-service
    container_name: codelab-auth
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks: [codelab]

  core-service:
    build: ./backend/core-service
    container_name: codelab-core
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    networks: [codelab]

  verification-service:
    build: ./backend/verification-service
    container_name: codelab-verification
    depends_on:
      kafka: { condition: service_started }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8082:8082"
    networks: [codelab]

  etl-service:
    build: ./backend/etl-service
    container_name: codelab-etl
    depends_on:
      kafka: { condition: service_started }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend/etl-service/data:/app/data
    ports:
      - "8083:8083"
    networks: [codelab]

  network-engine:
    build: ./backend/codelab-network-engine
    container_name: codelab-network
    environment:
      JWT_SECRET: ${JWT_SECRET}
      PLAYGROUND_STORAGE_DIR: /data/playground
    volumes:
      - playground-data:/data/playground
    ports:
      - "8084:8084"
    networks: [codelab]

  gateway:
    image: nginx:alpine
    container_name: codelab-gateway
    depends_on:
      - auth-service
      - core-service
      - verification-service
      - etl-service
      - network-engine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks: [codelab]

volumes:
  mysql-data:
  playground-data:

networks:
  codelab:
    driver: bridge
