server.port=8082
spring.application.name=codelab-verification
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=codelab-verification
codelab.jwt.secret=${JWT_SECRET:changeme}
codelab.groq.api-key=${GROQ_API_KEY:}
codelab.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
codelab.groq.reject-threshold=${GROQ_REJECT_THRESHOLD:0.6}
