server.port=8081
spring.application.name=codelab-core
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/core_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
codelab.jwt.secret=${JWT_SECRET:changeme}
codelab.network-engine.url=${NETWORK_ENGINE_URL:http://network-engine:8084}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=codelab-core
spring.kafka.consumer.auto-offset-reset=earliest
